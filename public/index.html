<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tareas DevOps — ITLA</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #1f3b63; } li.hecha { text-decoration: line-through; color: #777; }
    form { display: flex; gap: 8px; } input { flex: 1; padding: 8px; } button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h1>Lista de tareas</h1>
  <p id="aviso">Versión estática (GitHub Pages). Ejecuta <code>npm start</code> para usar la API.</p>
  <form id="f"><input id="t" placeholder="Nueva tarea" required><button>Agregar</button></form>
  <ul id="l"></ul>
  

<script>
    const lista = document.getElementById('l');
    const entrada = document.getElementById('t');
    const aviso = document.getElementById('aviso');

    // Detectar si estamos en GitHub Pages
    const githubPages = window.location.hostname.endsWith('github.io');

    function obtenerTareas() {
      return JSON.parse(localStorage.getItem('tareas-itla') || '[]');
    }

    function guardarTareas(tareas) {
      localStorage.setItem('tareas-itla', JSON.stringify(tareas));
    }

    async function cargar() {
      let tareas = [];

      if (githubPages) {
        tareas = obtenerTareas();
        aviso.textContent = 'Las tareas se guardan en este navegador.';
      } else {
        const respuesta = await fetch('/api/tareas');
        tareas = await respuesta.json();
        aviso.hidden = true;
      }

      lista.innerHTML = '';

      tareas.forEach(tarea => {
        const li = document.createElement('li');
        li.textContent = tarea.titulo;

        if (tarea.completada) {
          li.className = 'hecha';
        }

        li.style.cursor = 'pointer';

        li.onclick = async () => {
          if (githubPages) {
            tarea.completada = !tarea.completada;
            guardarTareas(tareas);
          } else {
            await fetch('/api/tareas/' + tarea.id, {
              method: 'PATCH'
            });
          }

          cargar();
        };

        lista.appendChild(li);
      });
    }

    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();

      const titulo = entrada.value.trim();
      if (!titulo) return;

      if (githubPages) {
        const tareas = obtenerTareas();

        tareas.push({
          id: Date.now(),
          titulo: titulo,
          completada: false
        });

        guardarTareas(tareas);
      } else {
        await fetch('/api/tareas', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ titulo })
        });
      }

      entrada.value = '';
      await cargar();
    });

    cargar();
  </script>

</body>
</html>
